<section class="section more-proyects" id="more-proyects">
    <div class="container">
        <div class="section-box">
            <div class="">
                <h3 class="section-title">
                    <span class='n-section-title'>04.</span> {{"OtherProjects.Title" | translate}}
                </h3>
            </div>
            <div class="mt-5">
                <!-- Group achievements by category -->
                <ng-container *ngFor="let category of getCategoryKeys(groupAchievementsByCategory('OtherProjects.Projects' | translate))">
                    <div class="category-section">
                        <h4 class="category-title">{{category}}</h4>
                        <div class="row p-0">
                            <div *ngFor='let project of groupAchievementsByCategory("OtherProjects.Projects" | translate)[category]; let i = index'
                              (click)="redirect(project['demoLink'], $event)"
                             class="col-12 col-md-6 col-lg-6 col-xl-4 proyect-col" data-aos="fade-up" data-aos-duration="1000">
                                <div class="more-proyect-box">
                                    <div class="row w-100 text-left m-0 p-0">
                                        <div class="col-6 p-0">
                                            <img src={{project.imgs}} [width]="getImageWidth(project.imgs)">
                                        </div>
                                        <div class="col-6 d-flex p-0 justify-content-end">
                                            <a style='color: inherit' [href]="project['demoLink']" target="_blank"><i id="demoLink" class="ml-3 fas fa-external-link-alt"></i></a>
                                        </div>
                                        <h5 class="other-proyect-title mt-4">{{project.Title}}</h5>
                                        <p class="other-proyect-description">
                                            {{project.Description}}
                                        </p>
                                    </div>
                                    <div>
                                        <ul class="more-proyects-skills">
                                            <li *ngFor='let technology of project.Technologies'>
                                              <span class="underline">{{technology}}</span>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </ng-container>
            </div>
        </div>
    </div>
</section>

        </div>

</section> -->
